[project]
name = "qqbot-next"
version = "2.0.0"
description = "基于 OneBot 协议的多账号 QQ 机器人框架（分层 + 插件架构）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.23",
    "websockets>=12",
    "aiohttp>=3.8",
    "brotlicffi>=1.1",  # aiohttp 3.13 + 官方 brotli 包解 br 编码不兼容（process 无 max_length），需 brotlicffi
    "curl_cffi>=0.15",  # 浏览器指纹模拟 HTTP 客户端（模块网络请求统一走 CurlCffiClient）
    "aiosqlite>=0.19",
    "pydantic>=2.4",
    "pydantic-settings>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
]

[project.scripts]
qqbot = "app.bootstrap:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
