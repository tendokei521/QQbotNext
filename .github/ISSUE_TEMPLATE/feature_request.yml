name: Feature request
description: 提出一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 先描述场景和痛点，不急着给方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
      description: 可以是界面、配置项、插件或框架层改动
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: 影响范围
      options:
        - label: 框架核心（会影响升级兼容性）
        - label: 内置插件
        - label: 管理后台 / 文案
        - label: 文档
