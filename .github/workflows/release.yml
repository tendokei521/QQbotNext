name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run backend tests
        run: python -m pytest -q

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: app/webui/dashboard/pnpm-lock.yaml

      - name: Install dashboard dependencies
        working-directory: app/webui/dashboard
        run: pnpm install --frozen-lockfile

      - name: Build dashboard
        working-directory: app/webui/dashboard
        run: pnpm build

      - name: Package dashboard dist
        # 真实产物在 app/webui/dashboard/dist（见 app/webui/app.py:53-55）；
        # 此前写成 -C dashboard dist 会让该 step 直接失败。
        run: tar -czf qqbot-next-dashboard-${{ github.ref_name }}.tar.gz -C app/webui/dashboard dist

      - name: Build Python distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Build deploy kit
        # 免安装包：解压双击 start.bat 即可（前端产物必须已在前面构建好）
        run: python scripts/build_deploy_kit.py --version "${GITHUB_REF_NAME#v}"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "${{ github.repository }}" \
            --title "$GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md \
            dist/*.whl \
            dist/*.tar.gz \
            dist/kit/QQBotNext-*-kit.zip \
            qqbot-next-dashboard-${{ github.ref_name }}.tar.gz