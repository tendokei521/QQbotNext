<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>上下文增强</title>
  <link rel="stylesheet" href="/api/plugin-sdk.css">
</head>
<body>
<div id="app"></div>
<script src="/api/plugin-sdk.js"></script>
<script>
  const on = (cfg) => cfg.context_enable !== false

  QQBOT.form({
    title: '上下文增强',
    description: '让模型按 id 取回上下文、理解「刚才 / 那条」指什么。改动自动保存。',
    groups: [
      {
        title: '上下文',
        fields: [
          {
            key: 'context_enable', label: '上下文增强', type: 'switch',
            hint: '开启后模型可用 get_context 按 id 取回消息 / 转发 / 成员 / 图片。',
          },
          {
            key: 'prefetch_reply', label: '内联引用正文', type: 'switch',
            hint: '本轮消息引用了某条时，自动把被引用的内容取回填进 reply_to。',
            visible: on,
          },
        ],
      },
    ],
  })
</script>
</body>
</html>
