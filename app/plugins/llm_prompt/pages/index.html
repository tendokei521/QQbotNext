<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>提示词组装</title>
  <link rel="stylesheet" href="/api/plugin-sdk.css">
</head>
<body>
<div id="app"></div>
<script src="/api/plugin-sdk.js"></script>
<script>
  QQBOT.form({
    title: '提示词组装',
    description: '行为规则怎么注入，本轮消息用哪种组装方式。改动自动保存。',
    groups: [
      {
        title: '提示词注入',
        hint: '影响系统提示词里的行为段',
        fields: [
          {
            key: 'behavior_rules_override', label: '覆盖行为规则', type: 'textarea', rows: 6,
            hint: '留空即使用内置规则；填写后整段替换（安全规则与工作方式仍会追加）。',
            placeholder: '留空 = 内置规则',
          },
          {
            key: 'participation', label: '参与度', type: 'select',
            hint: '低=少插话；高=更主动接话。只改语气与倾向，不改触发规则。',
            options: { low: '低（少插话）', normal: '正常', high: '高（多参与）' },
          },
        ],
      },
      {
        title: '消息组装方式',
        fields: [
          {
            key: 'structured_assembly', label: '结构化消息', type: 'switch',
            hint: '打开后用 [time][sender] 正文 [at] [reply_to] 的标记格式；关闭则只发原始正文。',
          },
        ],
      },
    ],
  })
</script>
</body>
</html>
