<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>流式输出</title>
  <link rel="stylesheet" href="/api/plugin-sdk.css">
</head>
<body>
<div id="app"></div>
<script src="/api/plugin-sdk.js"></script>
<script>
  const isSpeech = (cfg) => cfg.mode === 'speech'
  const isText = (cfg) => cfg.mode === 'text'
  const notText = (cfg) => cfg.mode !== 'text'

  QQBOT.form({
    title: '流式输出',
    description: '决定「回复怎么发出去」：一次发完、按句流式，还是先想后发（发言通道）。改动自动保存。',
    groups: [
      {
        title: '输出形态',
        fields: [
          {
            key: 'mode', label: '输出形态', type: 'select',
            hint: '发言通道=文本只当思考，真正发言走工具（可以主动不接话）；流式=按句发；一次性=想完发一条。',
            options: { speech: '发言通道（默认）', stream: '流式', text: '一次性' },
          },
        ],
      },
      {
        title: '流式发送',
        hint: '仅「流式 / 发言通道」生效',
        fields: [
          {
            key: 'stream_send_by_sentence', label: '按句子发送', type: 'switch',
            hint: '开启后按句切分逐条发；关闭则按长度上限切。',
            visible: notText,
          },
          {
            key: 'stream_sentence_max_length', label: '单句最大长度', type: 'number',
            min: 20, max: 2000, step: 1, unit: '字',
            visible: notText,
          },
          {
            key: 'stream_keep_order', label: '严格按顺序发送', type: 'switch',
            hint: '建议开启，避免气泡顺序错乱。',
            visible: notText,
          },
          {
            key: 'stream_send_pool_enabled', label: '启用发送池', type: 'switch',
            hint: '开启后用队列按节奏发送；关闭则逐句立刻发。',
            visible: notText,
          },
          {
            key: 'stream_send_interval_mode', label: '发送间隔模式', type: 'select',
            hint: '不等待=发得最快；固定间隔=恒定节奏；按字数=长句多等。',
            options: { none: '不等待', fixed: '固定间隔', length_curve: '按字数曲线' },
            visible: (cfg) => notText(cfg) && !!cfg.stream_send_pool_enabled,
          },
          {
            key: 'stream_send_interval_base_ms', label: '基础间隔', type: 'number',
            min: 0, max: 60000, step: 10, unit: 'ms',
            visible: (cfg) => notText(cfg) && cfg.stream_send_pool_enabled && cfg.stream_send_interval_mode !== 'none',
          },
          {
            key: 'stream_send_interval_min_ms', label: '最短间隔', type: 'number',
            min: 0, max: 60000, step: 10, unit: 'ms',
            visible: (cfg) => notText(cfg) && cfg.stream_send_pool_enabled && cfg.stream_send_interval_mode === 'fixed',
          },
          {
            key: 'stream_send_interval_max_ms', label: '最长间隔', type: 'number',
            min: 0, max: 60000, step: 10, unit: 'ms',
            visible: (cfg) => notText(cfg) && cfg.stream_send_pool_enabled && cfg.stream_send_interval_mode === 'fixed',
          },
          {
            key: 'stream_send_curve', label: '发送曲线', type: 'select',
            options: { none: '无', sqrt: '平方根', linear: '线性', short_long: '按长短句' },
            visible: (cfg) => notText(cfg) && cfg.stream_send_pool_enabled && cfg.stream_send_interval_mode === 'length_curve',
          },
          {
            key: 'stream_send_curve_k', label: '曲线强度', type: 'number',
            min: 0.1, max: 100, step: 0.1,
            visible: (cfg) => notText(cfg) && cfg.stream_send_pool_enabled && cfg.stream_send_interval_mode === 'length_curve' && cfg.stream_send_curve !== 'none',
          },
          {
            key: 'stream_short_message_length', label: '短句阈值', type: 'number',
            min: 1, max: 100, step: 1, unit: '字',
            visible: (cfg) => notText(cfg) && cfg.stream_send_pool_enabled && cfg.stream_send_interval_mode === 'length_curve' && cfg.stream_send_curve === 'short_long',
          },
          {
            key: 'stream_short_message_delay_ms', label: '短句延迟', type: 'number',
            min: 0, max: 60000, step: 10, unit: 'ms',
            visible: (cfg) => notText(cfg) && cfg.stream_send_pool_enabled && cfg.stream_send_interval_mode === 'length_curve' && cfg.stream_send_curve === 'short_long',
          },
          {
            key: 'stream_long_message_delay_ms', label: '长句延迟', type: 'number',
            min: 0, max: 60000, step: 10, unit: 'ms',
            visible: (cfg) => notText(cfg) && cfg.stream_send_pool_enabled && cfg.stream_send_interval_mode === 'length_curve' && cfg.stream_send_curve === 'short_long',
          },
          {
            key: 'stream_send_prefix', label: '每条前缀', type: 'text',
            placeholder: '可留空',
            visible: notText,
          },
          {
            key: 'stream_send_suffix', label: '每条后缀', type: 'text',
            placeholder: '可留空',
            visible: notText,
          },
          {
            key: 'stream_send_max_queue', label: '队列上限', type: 'number',
            min: 1, max: 200, step: 1, unit: '条',
            visible: (cfg) => notText(cfg) && !!cfg.stream_send_pool_enabled,
          },
          {
            key: 'stream_queue_full_policy', label: '队列满策略', type: 'select',
            options: { backpressure: '等待（背压）', drop_newest: '丢弃最新的', drop_oldest: '丢弃最旧的' },
            visible: (cfg) => notText(cfg) && !!cfg.stream_send_pool_enabled,
          },
          {
            key: 'stream_flush_on_finish', label: '结束后立即清空', type: 'switch',
            hint: '流结束后不再按间隔等待，把剩余气泡一次发完。',
            visible: (cfg) => notText(cfg) && !!cfg.stream_send_pool_enabled,
          },
        ],
      },
      {
        title: '发言通道',
        hint: '仅「发言通道」生效：文本只是思考，发言走工具',
        fields: [
          {
            key: 'speech_max_bubbles', label: '单轮最多几条', type: 'number',
            min: 1, max: 20, step: 1, unit: '条',
            visible: isSpeech,
          },
          {
            key: 'speech_max_bubble_chars', label: '单条字数上限', type: 'number',
            min: 20, max: 2000, step: 10, unit: '字',
            visible: isSpeech,
          },
          {
            key: 'speech_reminder_rounds', label: '催发言提醒轮次', type: 'number',
            min: 0, max: 10, step: 1, unit: '轮',
            hint: '剩余工具轮次不足该值时提醒模型尽快开口；0 = 不提醒。',
            visible: isSpeech,
          },
          {
            key: 'speech_force_reply_on_call', label: '被点名必须回应', type: 'switch',
            hint: '@ / 私聊 / 拍一拍时会补一轮逼它开口；群聊闲聊不强制。',
            visible: isSpeech,
          },
          {
            key: 'stream_output', label: '流式输出（兼容开关）', type: 'switch',
            hint: '旧版迁移用：输出形态已决定流式与否，这里通常不用改。',
            visible: isText,
          },
        ],
      },
    ],
  })
</script>
</body>
</html>
