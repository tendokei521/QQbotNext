<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>登录 · QQBot Next</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #171a23;
    --border: #262b38;
    --text: #e6e8ee;
    --muted: #8b93a7;
    --accent: #5b8cff;
    --accent-hover: #6f9bff;
    --danger: #ff6b6b;
    --ok: #3ddc97;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f6fa;
      --card: #ffffff;
      --border: #e2e6ee;
      --text: #1a1f2b;
      --muted: #6b7385;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
  }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: radial-gradient(1200px 600px at 50% -10%, rgba(91,140,255,.16), transparent 60%), var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%;
    max-width: 384px;
    padding: 32px 28px 26px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 18px 50px rgba(0,0,0,.28);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 22px;
  }
  .logo {
    width: 42px; height: 42px;
    display: grid; place-items: center;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), #8a5bff);
    font-size: 21px;
    flex: 0 0 auto;
  }
  .brand-name { font-size: 17px; font-weight: 600; letter-spacing: .2px; }
  .brand-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 6px; }
  .hint { font-size: 12.5px; color: var(--muted); line-height: 1.6; margin: 0 0 18px; }
  label { display: block; font-size: 12.5px; font-weight: 500; color: var(--muted); margin-bottom: 7px; }
  input[type=password] {
    width: 100%;
    padding: 11px 13px;
    font-size: 14.5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 9px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input[type=password]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(91,140,255,.18);
  }
  button {
    width: 100%;
    margin-top: 16px;
    padding: 11px 14px;
    font-size: 14.5px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 9px;
    cursor: pointer;
    transition: background .15s, transform .06s;
  }
  button:hover { background: var(--accent-hover); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .6; cursor: not-allowed; transform: none; }
  .error {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    margin-bottom: 16px;
    padding: 10px 12px;
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--danger);
    background: rgba(255,107,107,.1);
    border: 1px solid rgba(255,107,107,.28);
    border-radius: 9px;
  }
  .foot {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 11.5px;
    color: var(--muted);
    line-height: 1.6;
  }
  code {
    padding: 1px 5px;
    font-size: 11px;
    background: rgba(127,127,127,.14);
    border-radius: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <div class="logo">🤖</div>
      <div>
        <div class="brand-name">QQBot Next</div>
        <div class="brand-sub">管理后台</div>
      </div>
    </div>

    <h1>请输入访问令牌</h1>
    <p class="hint">令牌在首次启动时自动生成，已写入项目根目录的 <code>.env</code>，<br>也会打印在启动控制台的横幅里。</p>

    {error_block}

    <form method="post" action="/login">
      <input type="hidden" name="next" value="{next_path}">
      <label for="token">访问令牌</label>
      <input
        id="token"
        name="token"
        type="password"
        autocomplete="current-password"
        placeholder="粘贴启动控制台里的令牌"
        required
        autofocus
        spellcheck="false"
      >
      <button type="submit">登录</button>
    </form>

    <div class="foot">
      登录状态会保存在浏览器中，有效期 7 天。<br>
      忘记令牌？查看 <code>.env</code> 中的 <code>WEBUI_TOKEN</code>。
    </div>
  </main>
</body>
</html>
