<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>登录 · QQBot Next</title>
<style>
  /* 设计语言对齐 AstrBot dashboard（见 dashboard/src/plugins/vuetify.ts）：
     主色 #3c96ca / #5ba4d4，surface #fff / #242424，containerBg #fffffff4 / #1a1a1a */
  :root {
    --bg: #f6f9fc;
    --surface: #ffffff;
    --border: #e3e8ee;
    --text: #1b1c1d;
    --muted: #0000008a;
    --primary: #3c96ca;
    --secondary: #2f86bd;
    --error: #f44336;
    --ring: rgba(60, 150, 202, 0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a;
      --surface: #242424;
      --border: #333333;
      --text: #e8eaed;
      --muted: #ffffffa6;
      --primary: #5ba4d4;
      --secondary: #4a95c4;
      --error: #ff4d4f;
      --ring: rgba(91, 164, 212, 0.22);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    max-width: 400px;
    padding: 32px 32px 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .06), 0 12px 32px rgba(0, 0, 0, .06);
    animation: card-in .22s ease-out both;
  }
  @keyframes card-in {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }
  /* 尊重「减少动态效果」偏好 */
  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
  }

  .head { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
  .logo {
    width: 44px; height: 44px;
    flex: 0 0 auto;
    display: grid; place-items: center;
    border-radius: 12px;
    color: #fff;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
  }
  .titles h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: .2px; }
  .titles p  { margin: 3px 0 0; font-size: 13px; color: var(--muted); }

  /* 错误提示：对齐 AstrBot 的 tonal 警告（底色 + 左侧色条） */
  .alert {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 20px;
    padding: 11px 13px;
    font-size: 13px;
    line-height: 1.5;
    color: var(--error);
    background: rgba(244, 67, 54, .1);
    border-left: 4px solid var(--error);
    border-radius: 6px;
  }
  .alert svg { flex: 0 0 auto; }

  .field { position: relative; }
  .field > svg {
    position: absolute;
    left: 14px; top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }
  .field input {
    width: 100%;
    height: 48px;
    padding: 0 14px 0 42px;
    font-size: 14.5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .field input::placeholder { color: var(--muted); font-family: inherit; }
  .field input:hover { border-color: var(--muted); }
  .field input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--ring); }

  .submit {
    width: 100%;
    height: 48px;
    margin-top: 20px;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: .3px;
    color: #fff;
    background: var(--secondary);
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s, background .15s;
  }
  .submit:hover {
    background: var(--primary);
    transform: translateY(-1px);
    box-shadow: 0 5px 15px rgba(60, 150, 202, .28);
  }
  .submit:active { transform: none; box-shadow: none; }
  .submit:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  .foot {
    margin: 20px 0 0;
    font-size: 12px;
    line-height: 1.6;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="head">
      <span class="logo" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3.8" y="8.2" width="16.4" height="11" rx="3.4"/>
          <circle cx="12" cy="4.7" r="1.5" fill="currentColor" stroke="none"/>
          <path d="M12 6.2v2"/>
          <circle cx="9" cy="13.4" r="1.5" fill="currentColor" stroke="none"/>
          <circle cx="15" cy="13.4" r="1.5" fill="currentColor" stroke="none"/>
          <path d="M9.9 16.6h4.2"/>
        </svg>
      </span>
      <div class="titles">
        <h1>QQBot Next</h1>
        <p>管理后台</p>
      </div>
    </div>

    {error_block}

    <form method="post" action="/login">
      <input type="hidden" name="next" value="{next_path}">
      <div class="field">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/>
          <path d="M8 10.5V7.8a4 4 0 0 1 8 0v2.7"/>
        </svg>
        <input
          id="token"
          name="token"
          type="password"
          autocomplete="current-password"
          placeholder="访问令牌"
          aria-label="访问令牌"
          required
          autofocus
          spellcheck="false"
        >
      </div>
      <button type="submit" class="submit">登录</button>
    </form>

    <p class="foot">令牌见启动控制台或项目根目录 .env</p>
  </main>
</body>
</html>
