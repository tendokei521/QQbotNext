<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Agent 配置</title>
<style>
  :root { --bg:#f7fafc; --card:#fff; --border:#e2e8f0; --text:#2d3748; --muted:#718096; --blue:#3182ce; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", sans-serif; margin:0; background:var(--bg); color:var(--text); padding:20px; }
  h2 { margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:16px; margin-bottom:16px; }
  .card h3 { margin:0 0 12px; font-size:15px; border-bottom:1px solid var(--border); padding-bottom:8px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px 20px; }
  .full { grid-column: 1 / -1; }
  label { display:block; font-size:12px; font-weight:600; margin-bottom:4px; }
  .hint { font-size:11px; color:var(--muted); margin-bottom:4px; }
  input[type=text], input[type=password], input[type=number], select, textarea {
    width:100%; padding:7px 9px; border:1px solid #cbd5e0; border-radius:4px; font-size:13px; background:#fff;
  }
  textarea { resize: vertical; }
  .switch { position:relative; display:inline-block; width:40px; height:22px; }
  .switch input { display:none; }
  .slider { position:absolute; inset:0; background:#cbd5e0; border-radius:11px; transition:.2s; }
  .slider:before { content:""; position:absolute; width:18px; height:18px; left:2px; top:2px; background:#fff; border-radius:50%; transition:.2s; }
  .switch input:checked + .slider { background:var(--blue); }
  .switch input:checked + .slider:before { transform:translateX(18px); }
  .row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  button { padding:8px 22px; background:var(--blue); color:#fff; border:0; border-radius:4px; font-size:14px; cursor:pointer; }
  button.secondary { background:#4a5568; }
  button.danger { background:#a33; }
  button.sm { padding:3px 10px; font-size:12px; }
  #status { margin-left:10px; font-size:13px; color:#2f855a; }
  #status.err { color:#c53030; }
  .field { min-width:0; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  thead tr { text-align:left; color:var(--muted); }
  th, td { padding:4px; }
  .toolbar { position:sticky; top:0; background:var(--bg); padding:8px 0; z-index:10; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  #bot-select { width: auto; min-width: 200px; }
</style>
</head>
<body>
<h2>Agent 配置</h2>
<p class="sub">框架级 LLM Agent：配置 / 权限 / 定时任务 / 主动消息。</p>

<div class="toolbar">
  <label style="margin:0">账号：</label>
  <select id="bot-select" onchange="loadAll()"><option value="">加载中…</option></select>
  <button onclick="save()">保存配置</button>
  <span id="status"></span>
</div>

<div class="card">
  <h3>启停 / 权限</h3>
  <div class="row" style="justify-content:flex-start; gap:24px">
    <div class="row" style="gap:8px">
      <label style="margin:0">Agent 启用</label>
      <label class="switch"><input type="checkbox" id="enabled"><span class="slider"></span></label>
    </div>
    <div>
      <label>权限等级</label>
      <select id="authority_type" style="width:auto"></select>
    </div>
  </div>
  <div class="grid" style="margin-top:10px">
    <div>
      <label>群黑名单（每行一个群号）</label>
      <textarea id="group_list" rows="3" placeholder="放行所有群则留空"></textarea>
    </div>
    <div>
      <label>用户黑名单（每行一个QQ）</label>
      <textarea id="user_list" rows="3" placeholder="放行所有用户则留空"></textarea>
    </div>
  </div>
  <p class="hint">当前为黑名单模式：填了则被屏蔽，留空则放行。若需白名单，请在群/用户列表顶部加一行 <code>#whitelist</code>（框架后续支持）。</p>
</div>

<div class="card"><h3>API 设置</h3><div class="grid" id="g-api"></div></div>
<div class="card"><h3>模型参数</h3><div class="grid" id="g-model"></div></div>
<div class="card"><h3>功能开关</h3><div class="grid" id="g-switch"></div></div>
<div class="card"><h3>会话管理</h3><div class="grid" id="g-session"></div></div>
<div class="card"><h3>触发设置</h3><div class="grid" id="g-trigger"></div></div>
<div class="card"><h3>主动消息</h3><div class="grid" id="g-proactive"></div></div>
<div class="card"><h3>定时任务</h3><div class="grid" id="g-schedule"></div></div>

<div class="card">
  <h3>定时任务</h3>
  <p class="hint" style="margin-top:0">对话中提出定时请求会自动创建；也可手动添加。到期以 LLM 请求自然发言。</p>
  <div class="full" style="margin-bottom:10px">
    <div class="row" style="flex-wrap:wrap">
      <select id="tk-type" style="width:88px"><option value="private">私聊</option><option value="group">群聊</option></select>
      <input id="tk-target" type="text" placeholder="QQ号 / 群号" style="width:120px">
      <input id="tk-trigger" type="text" placeholder="时间表达式：明天早上8点 / 每天中午12点 / 每周五下午6点 / 5分钟后 / 08:30" style="flex:1;min-width:220px">
      <input id="tk-content" type="text" placeholder="到时要发送的内容" style="flex:1;min-width:180px">
      <button type="button" class="sm" onclick="addTask()">添加</button>
    </div>
  </div>
  <div style="margin-bottom:10px">
    <button type="button" class="sm secondary" onclick="loadTasks()">刷新任务</button>
    <span id="tk-status" style="margin-left:8px;font-size:12px;color:var(--muted)"></span>
  </div>
  <table>
    <thead><tr><th>任务ID</th><th>会话</th><th>重复</th><th>下次触发</th><th>次数</th><th>内容</th><th></th></tr></thead>
    <tbody id="tk-body"><tr><td colspan="7" style="color:var(--muted)">—</td></tr></tbody>
  </table>
</div>

<div class="card">
  <h3>主动消息状态</h3>
  <div style="margin-bottom:10px">
    <button type="button" class="sm secondary" onclick="loadProactive()">刷新状态</button>
    <span id="pr-status" style="margin-left:8px;font-size:12px;color:var(--muted)"></span>
  </div>
  <table>
    <thead><tr><th>会话</th><th>类型</th><th>启用</th><th>未回复</th><th>下次触发</th><th>计时器</th><th></th></tr></thead>
    <tbody id="pr-body"><tr><td colspan="7" style="color:var(--muted)">—</td></tr></tbody>
  </table>
</div>

<script>
  let BOT = '';
  const state = {};   // 配置字段 key -> { type, el }
  const spec = {};
  let SCHEMA = { groups: {}, items: {} };

  function status(msg, isErr) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = isErr ? 'err' : '';
  }

  function q(id) { return document.getElementById(id); }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function buildField(container, f) {
    const wrap = document.createElement('div');
    wrap.className = 'field' + (f.full ? ' full' : '');
    const label = document.createElement('label');
    label.textContent = f.label || f.l || f.k;
    wrap.appendChild(label);
    const hint = f.description || f.h;
    if (hint) { const h = document.createElement('div'); h.className='hint'; h.textContent = hint; wrap.appendChild(h); }
    let el, stype;
    const t = f.type || f.t;
    if (t === 'boolean' || t === 'bool') {
      const row = document.createElement('div'); row.className='row';
      el = document.createElement('input'); el.type='checkbox';
      const sw = document.createElement('label'); sw.className='switch';
      sw.appendChild(el); sw.appendChild(document.createElement('span')); sw.lastChild.className='slider';
      row.appendChild(sw); wrap.appendChild(row);
      stype = 'bool';
    } else if (t === 'select') {
      el = document.createElement('select');
      const opts = f.options || f.o || {};
      for (const [v, txt] of Object.entries(opts)) {
        const o = document.createElement('option'); o.value=v; o.textContent=txt; el.appendChild(o);
      }
      wrap.appendChild(el);
      stype = 'text';
    } else if (t === 'textarea') {
      el = document.createElement('textarea'); el.rows = f.rows || 4;
      wrap.appendChild(el);
      stype = 'text';
    } else if (t === 'string_list' || t === 'list') {
      el = document.createElement('textarea'); el.rows = f.rows || 4; el.placeholder = f.placeholder || '每行一个值';
      wrap.appendChild(el);
      stype = 'list';
    } else if (t === 'number') {
      el = document.createElement('input'); el.type='number';
      if (f.step) el.step = f.step;
      wrap.appendChild(el);
      stype = 'number';
    } else if (t === 'password') {
      el = document.createElement('input'); el.type='password';
      wrap.appendChild(el);
      stype = 'text';
    } else {
      el = document.createElement('input'); el.type='text';
      if (f.placeholder) el.placeholder = f.placeholder;
      wrap.appendChild(el);
      stype = 'text';
    }
    state[f.k || f.key] = { type: stype, el };
    spec[f.k || f.key] = f;
    container.appendChild(wrap);
  }

  // 按 schema 分组渲染配置表单（读后端 schema：label/description/options/boolean）
  function renderForm(items) {
    for (const k of Object.keys(state)) {
      const s = state[k];
      if (s.el && s.el.parentElement) s.el.parentElement.remove();
    }
    const groups = {
      'g-api': [], 'g-model': [], 'g-switch': [], 'g-session': [],
      'g-trigger': [], 'g-proactive': [], 'g-schedule': [],
    };
    const gmap = { group_api:'g-api', group_model:'g-model', group_switch:'g-switch',
                   group_session:'g-session', group_trigger:'g-trigger',
                   group_proactive:'g-proactive', group_schedule:'g-schedule' };
    for (const [k, f] of Object.entries(items)) {
      if (k === 'authority_type') continue;  // 权限等级由独立下拉处理
      const gid = gmap[f.group] || 'g-api';
      groups[gid].push({ ...f, k });
    }
    for (const [gid, fields] of Object.entries(groups)) {
      const cont = q(gid);
      if (!cont) continue;
      fields.forEach(f => buildField(cont, f));
    }
    // 权限等级下拉（独立处理）
    const at = q('authority_type');
    at.innerHTML = '';
    const atF = items.authority_type;
    const atOpts = (atF && (atF.options || atF.o)) || {};
    for (const [v, t] of Object.entries(atOpts)) {
      const o = document.createElement('option'); o.value=v; o.textContent=t; at.appendChild(o);
    }
  }

  function applyConfig(cfg) {
    for (const [k, s] of Object.entries(state)) {
      const v = cfg[k];
      if (s.type === 'bool') s.el.checked = !!v;
      else if (s.type === 'list') s.el.value = Array.isArray(v) ? v.join('\n') : (v || '');
      else s.el.value = v != null ? String(v) : '';
    }
  }

  // ---- 加载 ----
  async function loadBots() {
    try {
      const r = await fetch('/api/bots');
      const d = await r.json();
      const sel = q('bot-select');
      const bots = Array.isArray(d) ? d : (d.bots || []);
      sel.innerHTML = '';
      for (const b of bots) {
        if (b.bot_id == null) continue;
        const o = document.createElement('option');
        o.value = b.bot_id;
        o.textContent = `#${b.index} Bot ${b.bot_id} (${b.status || ''})`;
        sel.appendChild(o);
      }
      if (bots.length) { sel.value = BOT || bots[0].bot_id; }
      BOT = sel.value;
      if (!BOT) { sel.innerHTML = '<option value="">无已连接账号</option>'; }
    } catch (e) { status('加载账号失败: ' + e.message, true); }
  }

  async function loadConfig() {
    if (!BOT) return;
    try {
      const r = await fetch('/api/agent/config?bot_id=' + BOT);
      const d = await r.json();
      if (!d.ok) { status(d.message || '加载失败', true); return; }
      SCHEMA = d.schema || { groups: {}, items: {} };
      renderForm(SCHEMA.items);
      applyConfig(d.config || {});
      q('enabled').checked = !!d.enabled;
      q('authority_type').value = (d.config && d.config.authority_type) || 'strict';
      const perm = d.permission || {};
      q('group_list').value = (perm.group_list || []).join('\n');
      q('user_list').value = (perm.user_list || []).join('\n');
    } catch (e) { status('加载配置失败: ' + e.message, true); }
  }

  async function save() {
    if (!BOT) return;
    const body = { config: {} };
    for (const [k, s] of Object.entries(state)) {
      if (s.type === 'bool') body.config[k] = s.el.checked;
      else if (s.type === 'number') { const n = parseFloat(s.el.value); body.config[k] = isNaN(n) ? null : n; }
      else if (s.type === 'list') body.config[k] = s.el.value.split('\n').map(x => x.trim()).filter(Boolean);
      else body.config[k] = s.el.value;
    }
    body.config.authority_type = q('authority_type').value;
    body.enabled = q('enabled').checked;
    body.permission = {
      group_mode: 'blacklist',
      group_list: q('group_list').value.split('\n').map(x => x.trim()).filter(Boolean),
      user_mode: 'blacklist',
      user_list: q('user_list').value.split('\n').map(x => x.trim()).filter(Boolean),
    };
    try {
      const r = await fetch('/api/agent/config?bot_id=' + BOT, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
      });
      const res = await r.json();
      status((res && res.message) || '已保存', !(r.ok && res.status === 'success'));
    } catch (e) { status('保存失败: ' + e.message, true); }
  }

  // ---- 定时任务 ----
  const _REP = { once:'一次性', daily:'每天', weekly:'每周', monthly:'每月', interval:'间隔' };
  async function loadTasks() {
    if (!BOT) return;
    const body = q('tk-body'), st = q('tk-status');
    st.textContent = '加载中…';
    try {
      const r = await fetch('/api/agent/tasks?bot_id=' + BOT);
      const d = await r.json();
      const tasks = (d && d.tasks) || [];
      if (!tasks.length) { body.innerHTML = '<tr><td colspan="7" style="color:var(--muted)">暂无定时任务</td></tr>'; st.textContent=''; return; }
      body.innerHTML = tasks.map(t =>
        `<tr><td>${t.task_id.slice(0,8)}</td><td>${t.session_id}</td><td>${_REP[t.repeat]||t.repeat}</td>` +
        `<td>${t.next_trigger_time ? new Date(t.next_trigger_time*1000).toLocaleString() : '—'}</td>` +
        `<td>${t.fired_count}</td><td title="${esc(t.content)}">${esc(t.content)}</td>` +
        `<td><button class="sm" onclick="triggerTask('${t.task_id}')">触发</button> ` +
        `<button class="sm danger" onclick="cancelTask('${t.task_id}')">取消</button></td></tr>`).join('');
      st.textContent = `${tasks.length} 个任务`;
    } catch (e) { body.innerHTML = `<tr><td colspan="7" style="color:#c53030">加载失败: ${e.message}</td></tr>`; st.textContent=''; }
  }

  async function addTask() {
    if (!BOT) return;
    const body = {
      is_group: q('tk-type').value === 'group',
      target: q('tk-target').value.trim(),
      trigger: q('tk-trigger').value.trim(),
      content: q('tk-content').value.trim(),
    };
    if (!body.target || !body.trigger || !body.content) { status('请填写 目标 / 时间 / 内容', true); return; }
    try {
      const r = await fetch('/api/agent/tasks?bot_id=' + BOT, {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body),
      });
      const res = await r.json();
      status((res && res.message) || '已添加', !(r.ok && res.ok));
      if (r.ok && res.ok) { q('tk-content').value=''; setTimeout(loadTasks, 500); }
    } catch (e) { status('添加失败: ' + e.message, true); }
  }

  async function triggerTask(id) {
    try {
      const r = await fetch(`/api/agent/tasks/${id}/trigger?bot_id=${BOT}`, { method:'POST' });
      const res = await r.json();
      status((res && res.message) || '已触发', !(r.ok && res.status === 'success'));
      setTimeout(loadTasks, 1000);
    } catch (e) { status('触发失败: ' + e.message, true); }
  }

  async function cancelTask(id) {
    if (!confirm('确定取消定时任务 ' + id.slice(0,8) + ' ？')) return;
    try {
      const r = await fetch(`/api/agent/tasks/${id}/cancel?bot_id=${BOT}`, { method:'POST' });
      const res = await r.json();
      status((res && res.message) || '已取消', !(r.ok && res.status === 'success'));
      loadTasks();
    } catch (e) { status('取消失败: ' + e.message, true); }
  }

  // ---- 主动消息 ----
  async function loadProactive() {
    if (!BOT) return;
    const body = q('pr-body'), st = q('pr-status');
    st.textContent = '加载中…';
    try {
      const r = await fetch('/api/agent/proactive/status?bot_id=' + BOT);
      const d = await r.json();
      const sessions = (d && d.sessions) || [];
      if (!sessions.length) { body.innerHTML = '<tr><td colspan="7" style="color:var(--muted)">无已配置的主动会话</td></tr>'; st.textContent=''; return; }
      body.innerHTML = sessions.map(s => {
        const next = s.next_trigger_time ? new Date(s.next_trigger_time*1000).toLocaleString() : '—';
        const timer = s.timer ? (s.timer === 'private' ? '私聊计时' : '沉默计时') : '—';
        const btn = s.enabled ? `<button class="sm" onclick="triggerProactive('${s.session_id}')">触发</button>` : '';
        return `<tr><td>${s.session_id}</td><td>${s.type}</td><td>${s.enabled?'✅':'❌'}</td>` +
          `<td>${s.unanswered}</td><td>${next}</td><td>${timer}</td><td>${btn}</td></tr>`;
      }).join('');
      st.textContent = `${sessions.length} 个会话`;
    } catch (e) { body.innerHTML = `<tr><td colspan="7" style="color:#c53030">加载失败: ${e.message}</td></tr>`; st.textContent=''; }
  }

  async function triggerProactive(sessionId) {
    try {
      const r = await fetch('/api/agent/proactive/trigger?bot_id=' + BOT, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ session_id: sessionId }),
      });
      const res = await r.json();
      status((res && res.message) || '已触发', !(r.ok && res.status === 'success'));
      setTimeout(loadProactive, 2000);
    } catch (e) { status('触发失败: ' + e.message, true); }
  }

  async function loadAll() {
    // iframe（模块卡片）模式：固定用父页面选中账号；独立模式：用选择器
    BOT = window.PLUGIN_BOT_ID || q('bot-select').value;
    await loadConfig();
    await loadTasks();
    await loadProactive();
  }

  async function init() {
    if (window.PLUGIN_BOT_ID) {
      // iframe（模块卡片）模式：用父页面选中的账号，隐藏账号选择器
      BOT = window.PLUGIN_BOT_ID;
      const tb = q('bot-select').closest('.toolbar');
      if (tb) tb.style.display = 'none';
      await loadAll();
    } else {
      await loadBots();
      await loadAll();
    }
  }
  init();
</script>
</body>
</html>
